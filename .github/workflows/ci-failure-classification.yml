name: CI failure classification

on:
  workflow_dispatch:

# Intentionally manual-only. These workflows previously reacted to every
# completed workflow and could create noisy/recursive automation runs.
# Use the Actions UI when an explicit recovery/diagnostic run is wanted.

jobs:
  manual:
    runs-on: ubuntu-latest
    steps:
      - name: Manual-only notice
        run: echo "Manual recovery workflow. No automatic action is performed."
