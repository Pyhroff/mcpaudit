name: release
# Publishes to PyPI via trusted publishing (OIDC) when you push a tag like v1.2.0. No API token is stored.
# One-time setup on pypi.org -> your project -> Publishing: owner Pyhroff, repo mcpaudit, workflow release.yml, environment pypi.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Tag must match package version
        run: |
          v=$(python - <<'PY'
          import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])
          PY
          )
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version v$v"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
